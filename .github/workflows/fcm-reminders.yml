name: DINA95 FCM jelenléti emlékeztető

on:
  schedule:
    - cron: "*/5 6-15 * * *"
      timezone: "Europe/Budapest"

  workflow_dispatch:

concurrency:
  group: dina95-attendance-reminders
  cancel-in-progress: false

jobs:
  send-reminders:
    runs-on: ubuntu-latest

    steps:
      - name: Repository letöltése
        uses: actions/checkout@v4

      - name: Node.js beállítása
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Függőségek telepítése
        working-directory: notification-server
        run: npm ci

      - name: FCM emlékeztetők küldése
        working-directory: notification-server
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > serviceAccountKey.json

          node send-reminders.js

          rm -f serviceAccountKey.json